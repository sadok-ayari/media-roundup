name: check
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Script compiles
        run: python3 -m py_compile roundup.py
